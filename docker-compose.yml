services:
  mysql:
    image: mysql:8.4
    container_name: abf-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: abf_root_local_2026
      MYSQL_DATABASE: abf_alimentos
      MYSQL_USER: abf_user
      MYSQL_PASSWORD: abf_local_2026
      TZ: America/Mexico_City
    ports:
      - "3306:3306"
    volumes:
      - abf_mysql_data:/var/lib/mysql
      - ./db/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/local-admin.sql:/docker-entrypoint-initdb.d/02-local-admin.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pabf_root_local_2026"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:5
    container_name: abf-adminer-local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  abf_mysql_data:
